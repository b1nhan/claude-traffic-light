<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget.css">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

  <!-- Mode 1 & 2 Layout -->
  <div id="layout-full" class="layout-col">
    <div id="dots-box" class="container">
      <div id="dot-red" class="dot dot-red"></div>
      <div id="dot-yellow" class="dot dot-yellow"></div>
      <div id="dot-green" class="dot dot-green"></div>
    </div>

    <div id="label-box" class="label-container">
      <div id="status-label" class="status-label">CHƯA HOẠT ĐỘNG</div>
    </div>
  </div>

  <!-- Mode 3 Layout (Minimal) -->
  <div id="layout-minimal" class="container hidden" style="padding: 8px;">
    <div id="dot-minimal" class="dot dot-red"></div>
  </div>

  <script src="widget-render.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
