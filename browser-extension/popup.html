<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<style>
  body {
    width: 220px;
    margin: 0;
    padding: 16px;
    background: #1c1c20;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #666;
    flex-shrink: 0;
  }
  .dot.waiting { background: #e63228; box-shadow: 0 0 14px 2px #e63228aa; }
  .dot.running { background: #f5b414; box-shadow: 0 0 14px 2px #f5b414aa; }
  .dot.done    { background: #28b446; box-shadow: 0 0 14px 2px #28b446aa; }
  .dot.idle    { background: #666; }
  .title { color: #fff; font-size: 14px; font-weight: 600; }
  .message { color: #aaa; font-size: 11px; margin-top: 2px; }
  .footer { margin-top: 12px; font-size: 10px; color: #666; }
</style>
</head>
<body>
  <div class="row">
    <div class="dot idle" id="dot"></div>
    <div>
      <div class="title" id="title">Đang tải…</div>
      <div class="message" id="message"></div>
    </div>
  </div>
  <div class="footer">Nguồn: tab claude.ai đang mở</div>
  <div class="footer"><a href="#" id="openOptions" style="color:#8fb5ff">⚙ Cài đặt widget</a></div>
  <script src="popup.js"></script>
</body>
</html>
